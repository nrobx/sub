name: sub check

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "filter.py"
      - ".github/workflows/main.yml"

jobs:
  filter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --upgrade pyyaml

      - name: run py
        env:
          OUTPUT_DIR: ${{ github.workspace }}
        run: python3 filter.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update filtered configs [skip ci]"
            git push
          fi
